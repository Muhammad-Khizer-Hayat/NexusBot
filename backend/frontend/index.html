<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NexusBot — AI Assistant</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236c63ff'/%3E%3Cline x1='9' y1='9' x2='9' y2='23' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='9' y1='9' x2='23' y2='23' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='23' y1='13' x2='23' y2='23' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="style.css?v=1780640040"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- ══ AUTH SCREEN ════════════════════════════════════════════ -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
          <polygon points="28,2 52,15 52,41 28,54 4,41 4,15" fill="#6c63ff" opacity="0.12"/>
          <polygon points="28,5 49,17 49,39 28,51 7,39 7,17" fill="none" stroke="#6c63ff" stroke-width="1.5" opacity="0.35"/>
          <polygon points="28,9 47,20 47,36 28,47 9,36 9,20" fill="#6c63ff"/>
          <line x1="20" y1="19" x2="20" y2="37" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="20" y1="19" x2="36" y2="37" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <line x1="36" y1="23" x2="36" y2="37" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <circle cx="28" cy="1.5" r="2.5" fill="#6c63ff" opacity="0.55"/>
          <circle cx="28" cy="54.5" r="2.5" fill="#6c63ff" opacity="0.55"/>
          <circle cx="53" cy="14" r="2" fill="#6c63ff" opacity="0.4"/>
          <circle cx="53" cy="42" r="2" fill="#6c63ff" opacity="0.4"/>
          <circle cx="3"  cy="14" r="2" fill="#6c63ff" opacity="0.4"/>
          <circle cx="3"  cy="42" r="2" fill="#6c63ff" opacity="0.4"/>
        </svg>
      </div>
      <div>
        <h1 class="auth-title">Nexus<span style="color:#6c63ff">Bot</span></h1>
        <p class="auth-sub">LangGraph · ReAct · RAG · Web Search</p>
      </div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Sign Up</button>
    </div>
    <div id="auth-error" class="auth-msg error" style="display:none"></div>
    <div id="auth-success" class="auth-msg success" style="display:none"></div>
    <div id="login-form">
      <input class="auth-input" id="login-id" type="text" placeholder="Username or email" autocomplete="username"/>
      <input class="auth-input" id="login-password" type="password" placeholder="Password" autocomplete="current-password"/>
      <button class="auth-btn primary" id="login-btn" onclick="doLogin()">Sign In</button>
      <div class="auth-divider"><span>or</span></div>
      <div class="google-btn" onclick="googleSignIn()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>
        Continue with Google
      </div>
      <button class="auth-btn ghost" onclick="guestMode()">Continue as Guest</button>
    </div>
    <div id="register-form" style="display:none">
      <input class="auth-input" id="reg-username" type="text" placeholder="Username (min 3 chars)" autocomplete="username"/>
      <input class="auth-input" id="reg-email" type="email" placeholder="Email (optional)" autocomplete="email"/>
      <input class="auth-input" id="reg-password" type="password" placeholder="Password (min 6 chars)" autocomplete="new-password"/>
      <button class="auth-btn primary" id="register-btn" onclick="doRegister()">Create Account</button>
      <div class="auth-divider"><span>or</span></div>
      <div class="google-btn" onclick="googleSignIn()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>
        Sign Up with Google
      </div>
    </div>
  </div>
</div>

<!-- ══ MAIN APP ═══════════════════════════════════════════════ -->
<div class="app" id="app" style="display:none">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" style="flex-shrink:0">
          <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#6c63ff"/>
          <line x1="10" y1="11" x2="10" y2="21" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
          <line x1="10" y1="11" x2="22" y2="21" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
          <line x1="22" y1="14" x2="22" y2="21" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Nexus<span style="color:#6c63ff">Bot</span></span>
      </div>
      <button class="new-chat-btn" onclick="newChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
    </div>
    <div class="chat-history" id="chat-history">
      <div class="history-label">Recent Chats</div>
    </div>
    <div class="sidebar-bottom">
      <div class="user-info" id="user-info">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-details">
          <div class="user-name" id="user-name">Guest</div>
          <div class="user-role">NexusBot User</div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Logout">↩</button>
      </div>
      <div class="rag-pill"><span class="rag-dot" id="rag-dot"></span><span id="rag-label">RAG Off</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">Nexus<span style="color:#6c63ff">Bot</span></div>
      <div class="topbar-right">
        <div class="datetime-pill" id="datetime-pill"></div>
        <button class="export-btn" onclick="exportChat()" title="Export chat">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          Theme
        </button>
        <button class="tts-btn" id="tts-btn" onclick="toggleTTS()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Voice
        </button>
        <div class="status-pill"><span class="dot"></span>Online</div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-section">

      <!-- Plus button popup menu -->
      <div class="plus-popup" id="plus-popup" style="display:none">
        <div class="popup-item" onclick="triggerFileUpload('file')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          Add files or photos
        </div>
        <div class="popup-item" onclick="triggerFileUpload('image')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Upload image (OCR)
        </div>
        <div class="popup-item" onclick="triggerFileUpload('pdf')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Upload PDF / TXT
        </div>
      </div>

      <!-- Hidden file inputs -->
      <input type="file" id="input-file-any"   accept=".pdf,.txt,.md,image/*"  style="display:none" onchange="handleAnyFile(this.files[0])"/>
      <input type="file" id="input-file-image" accept="image/*"                style="display:none" onchange="handleImageUpload(this.files[0])"/>
      <input type="file" id="input-file-pdf"   accept=".pdf,.txt,.md"          style="display:none" onchange="uploadFile(this.files[0])"/>

      <div class="input-box">
        <!-- Plus button -->
        <button class="plus-btn" id="plus-btn" onclick="togglePlusPopup()" title="Add files or photos">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

        <textarea id="user-input" placeholder="Message NexusBot..."
          rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>

        <!-- Mic button -->
        <div class="mic-wrap">
          <div class="mic-ring" id="mic-ring"></div>
          <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Voice input">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
        </div>

        <!-- Send button -->
        <button id="send-btn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-note">NexusBot can make mistakes. Verify important information.</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({startOnLoad:false, theme:"dark", securityLevel:"loose"});</script>
<script src="script.js?v=1780640040"></script>
</body>
</html>
